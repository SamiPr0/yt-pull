<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>yt-pull</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">▶</span>
        <span class="brand-name">yt-pull</span>
      </div>
      <a
        class="github-link"
        href="https://github.com/SamiPr0/yt-pull"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
            1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
            0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68
            0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
            0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38
            A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span>Source on GitHub</span>
      </a>
    </div>
    <p class="tagline">Single video, playlist, or a batch of links — nothing is stored on the server.</p>
  </header>

  <main class="container">
    <section class="input-card">
      <label for="urls" class="field-label">YouTube link(s)</label>
      <textarea
        id="urls"
        rows="4"
        placeholder="Paste a video link, a playlist link, or several links (one per line)&#10;https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/playlist?list=..."
      ></textarea>

      <div class="controls-row">
        <div class="quality-picker">
          <label for="defaultQuality">Default quality</label>
          <select id="defaultQuality">
            <option value="best">Best available</option>
            <option value="2160p">2160p (4K)</option>
            <option value="1440p">1440p (2K)</option>
            <option value="1080p" selected>1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="360p">360p</option>
          </select>
        </div>
        <button id="analyzeBtn" class="btn btn-primary">
          <span class="btn-label">Analyze</span>
          <span class="spinner hidden"></span>
        </button>
      </div>

      <p id="globalError" class="error-msg hidden"></p>
    </section>

    <section id="resultsSection" class="results-section hidden">
      <div class="results-header">
        <h2 id="resultsTitle">Results</h2>
        <button id="downloadAllBtn" class="btn btn-secondary hidden">Download all</button>
      </div>
      <div id="resultsList" class="results-list"></div>
    </section>

    <footer class="disclaimer">
      Personal tool built on <code>yt-dlp</code>. Respect copyright and YouTube's terms of
      service: only download content you have the right to save.
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
